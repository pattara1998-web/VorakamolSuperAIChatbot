<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd3fc"/>
      <stop offset="30%" style="stop-color:#38bdf8"/>
      <stop offset="60%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
    <linearGradient id="aiGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0369a1"/>
      <stop offset="50%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#bae6fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- AI Logo Group -->
  <g filter="url(#shadow)" transform="translate(60, 80)">
    <!-- Letter A -->
    <path d="M80 320 L160 60 L200 60 L280 320 L240 320 L220 250 L140 250 L120 320 Z M155 220 L205 220 L180 130 Z" 
          fill="url(#aiGrad)" stroke="url(#aiGrad2)" stroke-width="2"/>
    
    <!-- Letter I -->
    <path d="M300 60 L340 60 L340 320 L300 320 Z" 
          fill="url(#aiGrad)" stroke="url(#aiGrad2)" stroke-width="2"/>
    
    <!-- Dot on I -->
    <circle cx="320" cy="30" r="18" fill="url(#aiGrad)" stroke="url(#aiGrad2)" stroke-width="2"/>
    
    <!-- Crystal facets on A -->
    <path d="M160 60 L180 130 L140 130 Z" fill="#bae6fd" opacity="0.3"/>
    <path d="M200 60 L220 130 L180 130 Z" fill="#7dd3fc" opacity="0.2"/>
    <path d="M140 250 L180 130 L220 250 Z" fill="#38bdf8" opacity="0.15"/>
    
    <!-- Crystal facets on I -->
    <path d="M300 60 L320 120 L340 60 Z" fill="#bae6fd" opacity="0.3"/>
    <path d="M300 180 L320 240 L340 180 Z" fill="#7dd3fc" opacity="0.2"/>
    
    <!-- Speech bubble tail -->
    <path d="M120 320 L80 380 L160 340 Z" fill="url(#aiGrad)" stroke="url(#aiGrad2)" stroke-width="2"/>
  </g>
  
  <!-- Glow effect -->
  <circle cx="256" cy="230" r="120" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2" filter="url(#glow)"/>
</svg>