# Render Blueprint — Vorakamol SuperAI Chatbot
# Docs: https://render.com/docs/blueprint-spec
#
# This file provisions:
#   - a PostgreSQL database (all persistent data: pages, customers, orders,
#     chat history, logs, settings)
#   - a Node Web Service that runs BOTH:
#     - the React (Vite) dashboard, served statically from /dist
#     - the Express API + Facebook Webhook, from the bundled dist/server.cjs
#
# Usage: push this repo to GitHub → in Render Dashboard choose "New +" →
#        "Blueprint" → connect the repo. Render reads this file automatically.

databases:
  - name: vorakamol-superai-db
    databaseName: superai
    plan: free
    region: singapore # same region as the web service for low latency

services:
  - type: web
    name: vorakamol-superai-chatbot
    runtime: node
    plan: free
    region: singapore # closest region to Thailand (lower latency)
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Pin Node runtime (matches @types/node ^22 in package.json)
      - key: NODE_VERSION
        value: 22.12.0
      # Required so the server serves the built /dist assets instead of Vite dev middleware
      - key: NODE_ENV
        value: production
      # PostgreSQL connection string, wired automatically to the database above.
      # NOTE: Render free-tier Postgres expires after 30 days — upgrade the
      # plan, or point DATABASE_URL at Neon/Supabase (permanent free tiers) by
      # setting it manually in the Render Dashboard instead.
      - key: DATABASE_URL
        fromDatabase:
          name: vorakamol-superai-db
          property: connectionString
      # Where the in-memory store writes its JSON backup snapshot.
      # NOTE: the free-tier filesystem is EPHEMERAL (wiped on redeploy/restart).
      # PostgreSQL is the durable store; this file is only a local backup.
      - key: DATA_FILE
        value: data/superai-v2.8.json
      # --- Secrets: fill these in the Render Dashboard after first deploy ---
      # (sync: false = Render will prompt you for the value, never commit it)
      - key: GEMINI_API_KEY
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_VERIFY_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v24.0
      # OAuth scopes requested during Facebook connect.
      # IMPORTANT: `pages_manage_posts` and `pages_manage_engagement` are ADVANCED
      # permissions that Meta rejects with "Invalid Scopes" until the app passes
      # App Review (Advanced Access). The default below uses only Standard Access
      # scopes that work immediately for new apps.
      # Once Meta approves Advanced Access, add `pages_manage_engagement` here
      # (needed for comment replies) without redeploying.
      - key: FB_OAUTH_SCOPES
        value: pages_show_list,pages_manage_metadata,pages_read_engagement,pages_messaging
      # Used by server.ts to AES-256-GCM encrypt stored tokens.
      # generateValue: true → Render creates a strong random secret for you.
      - key: ENCRYPTION_SECRET_KEY
        generateValue: true
      # PORT is injected automatically by Render — do NOT set it here.
